<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Prairie Ember Fibres - Coming Soon</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">
<style type="text/css">
* {
	font-family: "Satisfy", cursive;
	font-weight: 400;
	font-style: normal;
}
html, body {
	padding: 0;
	margin: 0;
	min-height: 100vh;
	min-width: 100%;
}

body {
	position: relative;
	isolation: isolate;
	background: #302820 url("data:image/webp;base64,UklGRm4AAABXRUJQVlA4IGIAAADQBACdASogABUAPwF2r1MrJyQiqAqpYCAJZQAALnUBeJcTgHwoOzlbo7kHPqO/AAD+0ukaD3G/H9B8ZXOtFGOU7pbdyvCFAYt+d4Rd1y0klda370Y5P5zID6VNhgyp7SwAAA==") center / cover no-repeat;
}

.background {
	position: absolute;
	inset: 0;
	z-index: -1;
	pointer-events: none;
}

.background img {
	display: block;
	width: 100%;
	height: 100%;
	object-fit: cover;
	object-position: center;
	opacity: 0;
	transition: opacity 600ms ease;
}

.background img.is-loaded {
	opacity: 1;
}

@media (prefers-reduced-motion: reduce) {
	.background img {
		transition: none;
	}
}

.fh {
	display: flex;
	justify-content: center;
	align-items: center;
	text-align: center;
	height: 66vh;

	font-size: 3em;
}

.fh h1 {
	margin-top: 0;
	margin-bottom: .25rem;
}
.fh p {
	margin: 0;
}
.fh svg {
	margin-top: 1em;
	margin-bottom: 1em;
	height: 128px;
	width: 128px;
}

</style>
<noscript><style>.background img { opacity: 1; }</style></noscript>

<script>
	window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
	plausible.init()
</script>

	</head>
	<body>
		<picture class="background" aria-hidden="true">
			<source media="(min-width: 2561px)" srcset="background.webp">
			<source media="(min-width: 1921px)" srcset="background-2560.webp">
			<source media="(min-width: 1281px)" srcset="background-1920.webp">
			<source media="(min-width: 641px)" srcset="background-1280.webp">
			<img id="background-image" src="background-640.webp" alt="" decoding="async" fetchpriority="high">
		</picture>
		<div class="fh">
			<div>
				<h1>Prairie Ember Fibres</h1>
				<p>Coming soon...</p>
			</div>
		</div>
		<script>
			(() => {
				const background = document.getElementById("background-image");

				async function revealBackground() {
					const source = background.currentSrc;
					try {
						if (background.decode) await background.decode();
						if (background.naturalWidth && background.currentSrc === source) {
							background.classList.add("is-loaded");
						}
					} catch {
						// Keep the placeholder if loading or decoding fails.
					}
				}

				background.addEventListener("load", revealBackground);
				if (background.complete && background.naturalWidth) revealBackground();
			})();
		</script>
	</body>
</html>
